name: Dependency security audit

on:
  push:
    branches: ["feat/**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile on same-repository PR or branch push
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "chore: commit reproducible dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
      - name: Install from committed lockfile
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
