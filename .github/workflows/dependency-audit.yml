name: Dependency security audit

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare package manager
        run: corepack enable
      - name: Resolve dependency graph for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit reproducible lockfile on trusted branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "chore: commit reproducible dependency lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Audit dependencies
        run: npm audit --audit-level=high
