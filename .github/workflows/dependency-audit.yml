name: Dependency security audit

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare package manager
        run: corepack enable
      - name: Resolve dependency graph for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Audit dependencies
        run: npm audit --audit-level=high
