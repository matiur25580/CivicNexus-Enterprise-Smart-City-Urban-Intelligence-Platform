name: Refresh npm lockfile
on:
  push:
    branches: ["feat/milestone-1-enterprise-foundation"]
    paths: ["apps/web/package.json", ".github/workflows/refresh-lockfile.yml"]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for Keycloak web adapter" || exit 0
          git push
